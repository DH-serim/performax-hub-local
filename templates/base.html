<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Performax Hub</title>
<link rel="stylesheet" href="/static/style.css" />
{% block head %}{% endblock %}
</head>
<body>

<!-- 사이드바 -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-logo">
      <div>
        <div class="logo-text">Performax Hub</div>
        <div class="logo-sub">Marketing Platform</div>
      </div>
      <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="사이드바 닫기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>
    </div>
    <div class="sidebar-nav">
      <div class="nav-category">키워드 분석</div>
      <a href="/keyword-trend" class="nav-item {% if active == 'keyword-trend' %}active{% endif %}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        키워드 트렌드 분석
      </a>
      <a href="/keyword-query" class="nav-item {% if active == 'keyword-query' %}active{% endif %}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        키워드 쿼리 조회
      </a>

      <div class="nav-category">UTM</div>
      <a href="/utm-builder" class="nav-item {% if active == 'utm-builder' %}active{% endif %}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        UTM 빌더
      </a>
    </div>
  </div>
</nav>

<!-- 메인 -->
<div class="main" id="main">
  <header class="main-header">
    <button class="sidebar-toggle" id="sidebarOpenBtn" onclick="toggleSidebar()" aria-label="사이드바 열기" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
      </svg>
    </button>
    <h1>{% block title %}{% endblock %}</h1>
  </header>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
</div>

{% block scripts %}{% endblock %}
<script>
function toggleSidebar() {
  const sidebar    = document.getElementById('sidebar');
  const main       = document.getElementById('main');
  const openBtn    = document.getElementById('sidebarOpenBtn');
  const isOpen     = !sidebar.classList.contains('collapsed');
  sidebar.classList.toggle('collapsed', isOpen);
  main.classList.toggle('sidebar-collapsed', isOpen);
  openBtn.style.display = isOpen ? 'flex' : 'none';
}
</script>
</body>
</html>
